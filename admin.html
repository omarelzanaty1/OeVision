<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin — Omar Elzanaty</title>
<link rel="icon" href="assets/logo.svg"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>.arow{display:flex;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;flex-wrap:wrap;transition:border-color .2s}.arow:hover{border-color:var(--line2)}
.arow img{width:64px;height:48px;object-fit:cover;border-radius:var(--r-s);background:#0e0e14}.arow .grow{flex:1;min-width:150px}
.st{display:inline-flex;align-items:center;gap:8px;font:600 11px Outfit,Cairo,sans-serif;letter-spacing:.08em;color:var(--mu)}.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.st.pub{color:var(--ok)}
.dng{background:none;border-color:#ff6b6b66;color:var(--bad)}.dng:hover{background:var(--bad);border-color:var(--bad);color:#0b0b0f}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}.th{width:110px;display:grid;gap:4px}.th img{width:110px;height:80px;object-fit:cover;border-radius:var(--r-s)}.th div{display:flex;gap:4px}.th button{flex:1;padding:2px;cursor:pointer}
#back{margin-inline-start:12px;white-space:nowrap}#tabs[hidden]~#back{margin-inline-start:auto}@media(max-width:640px){.nav{gap:8px;flex-wrap:wrap}#back{margin-inline-start:auto}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.two{grid-template-columns:1fr}}</style></head>
<body><header class="nav"><a class="brand" href="index.html"><img src="assets/logo.svg" alt=""><span>ADMIN</span></a><nav id="tabs" hidden style="display:flex;gap:6px;margin-inline-start:auto"><button class="btn gh sm" data-t="p">الأعمال</button><button class="btn gh sm" data-t="r">طلبات العملاء</button><button class="btn gh sm" data-t="w">تحرير الموقع</button></nav><a id="back" class="btn or sm" href="index.html#/home">العودة للموقع</a></header>
<main id="app" class="wrap"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
