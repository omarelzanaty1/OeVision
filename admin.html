<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="assets/logo.svg"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>.arow{display:flex;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;flex-wrap:wrap}
.arow img{width:64px;height:48px;object-fit:cover;border-radius:8px;background:#0e0e14}.arow .grow{flex:1;min-width:150px}
.st{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--line)}.st.pub{color:#38d98a;border-color:#38d98a}
.sm{padding:6px 14px;font-size:13px}.dng{background:#d94848}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}.th{width:110px;display:grid;gap:4px}.th img{width:110px;height:80px;object-fit:cover;border-radius:8px}.th div{display:flex;gap:4px}.th button{flex:1;padding:2px;cursor:pointer}
#back{margin-inline-start:12px;white-space:nowrap}#tabs[hidden]~#back{margin-inline-start:auto}@media(max-width:640px){.nav{gap:8px;flex-wrap:wrap}#back{margin-inline-start:auto}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.two{grid-template-columns:1fr}}</style></head>
